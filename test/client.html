<!doctype html>
<!-- One fake Spotify running the real built extension (dist/jamtime.js) with
     real PeerJS. Open test/browser.html to run two side by side. -->
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { background: #121212; color: #fff; font: 14px system-ui, sans-serif; margin: 0; padding: 12px;
      --spice-text: #fff; --spice-button: #1ed760; --spice-card: #282828; --spice-main-elevated: #242424; }
    #bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 12px; opacity: .8; }
    #player { font-family: monospace; }
  </style>
</head>
<body>
  <div id="bar"><span id="topbar"></span><span id="player"></span></div>
  <div id="modal"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const name = params.get('name') || 'Tester';
    const p = { uri: params.get('uri') || 'spotify:track:4cOdK2wGLETKBW3PvgPWqT', pos: Number(params.get('pos') || 0) * 1000, playing: params.get('playing') !== '0', at: Date.now(), dur: 200000 };
    const progress = () => Math.min(p.dur, p.pos + (p.playing ? Date.now() - p.at : 0));
    const freeze = () => ((p.pos = progress()), (p.at = Date.now()));
    window.__p = p;
    window.__progress = progress;
    window.__notes = [];
    const Player = {
      get data() { return { item: { uri: p.uri, name: 'Song ' + p.uri.slice(-4), artists: [{ name: 'Artist' }], images: [] } }; },
      getProgress: progress, getDuration: () => p.dur, isPlaying: () => p.playing,
      seek: (ms) => (freeze(), (p.pos = ms)),
      play: () => (freeze(), (p.playing = true)),
      pause: () => (freeze(), (p.playing = false)),
      playUri: async (u) => { await new Promise((r) => setTimeout(r, 150)); p.uri = u; p.pos = 0; p.at = Date.now(); p.playing = true; },
      addEventListener() {},
    };
    window.__player = Player;
    window.Spicetify = {
      Player,
      Topbar: { Button: class { constructor(label, icon, onClick) { const b = document.createElement('button'); b.id = 'open'; b.textContent = label; b.onclick = onClick; document.getElementById('topbar').append(b); } } },
      PopupModal: { display: ({ content }) => document.getElementById('modal').replaceChildren(content) },
      ContextMenu: { Item: class { register() {} } },
      Platform: { UserAPI: { getUser: async () => ({ displayName: name }) }, ClipboardAPI: { copy: async () => {} } },
      CosmosAsync: { get: async () => { throw new Error('no api in test'); } },
      LocalStorage: { get: () => null, set() {} },
      showNotification: (t) => window.__notes.push(t),
    };
    setInterval(() => {
      document.getElementById('player').textContent = `${name}: ${p.uri.slice(-4)} ${p.playing ? '▶' : '⏸'} ${(progress() / 1000).toFixed(1)}s`;
    }, 250);
  </script>
  <script src="../dist/jamtime.js"></script>
</body>
</html>
